<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>DN服务器 - 卡密验证</title>
    <style>
        :root{
            --bg: #0b1322;
            --card: rgba(22,33,62,0.85);
            --text: #fff;
            --border: #224b80;
            --main: #00adb5;
        }
        .light-mode{
            --bg: #f0f4f8;
            --card: rgba(255,255,255,0.85);
            --text: #111;
            --border: #ccc;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑,sans-serif;}
        body{
            width:100%;height:100vh;overflow:hidden;
            display:flex;flex-direction:column;
            justify-content:center;align-items:center;
            background:var(--bg);color:var(--text);
            transition: background 0.5s;padding-top: 60px;
        }
        #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}

        /* 灵动岛播放器 */
        .island{
            position:fixed;top:10px;left:50%;transform:translateX(-50%);
            width:240px;height:40px;
            background:rgba(0,0,0,0.25);
            backdrop-filter:blur(24px);
            border-radius:999px;
            display:flex;align-items:center;justify-content:center;
            z-index:9999;
            border:1px solid rgba(255,255,255,0.15);
            overflow:hidden;
        }
        .light-mode .island{background:rgba(255,255,255,0.7);border-color:rgba(0,0,0,0.1);}
        .island audio{width:230px;height:35px;border-radius:20px;}

        /* 数据面板 */
        .data-panel{
            background:var(--card);backdrop-filter: blur(12px);
            border:1px solid var(--border);border-radius:12px;
            padding:10px 16px;width:90%;max-width:420px;
            margin-bottom:15px;display:flex;
            justify-content:space-around;text-align:center;
        }
        .data-item p{font-size:12px;color:#999;}
        .data-item span{font-size:16px;color:var(--main);font-weight:bold;}

        /* 公告栏 */
        .notice-box{
            background:var(--card);backdrop-filter: blur(12px);
            border:1px solid var(--border);border-radius:12px;
            padding:12px 16px;width:90%;max-width:420px;
            margin-bottom:20px;
        }
        .notice-title{
            font-size:14px;color:var(--main);margin-bottom:8px;
            display:flex;justify-content:space-between;align-items:center;
        }
        .notice-content{
            width:100%;min-height:60px;background:transparent;
            border:none;outline:none;color:var(--text);
            font-size:14px;resize:none;
            pointer-events:none;opacity:0.75;
        }
        .notice-content.edit-on{
            pointer-events:auto;opacity:1;
            border:1px dashed var(--main);border-radius:8px;padding:6px;
        }
        .notice-btn{
            font-size:12px;padding:2px 8px;border-radius:6px;
            background:var(--border);color:var(--text);
            border:none;cursor:pointer;margin-left:4px;
        }

        .login-card{
            background:var(--card);padding:40px 30px;border-radius:16px;
            box-shadow:0 0 30px #00adb560;text-align:center;
            width:90%;max-width:420px;
            backdrop-filter: blur(12px);border:1px solid var(--border);
        }
        .login-card h2{color:var(--text);margin-bottom:30px;letter-spacing:3px;}
        .input-box{
            width:100%;padding:14px 18px;border:none;border-radius:8px;
            background:var(--border);color:var(--text);
            font-size:16px;margin-bottom:25px;outline:none;
        }
        .submit-btn{
            width:100%;padding:13px;border:none;border-radius:8px;
            background:var(--main);color:#fff;font-size:16px;cursor:pointer;margin-bottom:12px;
        }
        .guest-btn{
            width:100%;padding:11px;border:none;border-radius:8px;
            background:#22c55e;color:#fff;font-size:15px;cursor:pointer;
        }
        .themeBtn{
            position:fixed;top:15px;right:15px;
            background:var(--card);color:var(--text);
            border:1px solid var(--border);padding:6px 12px;
            border-radius:6px;z-index:9999;backdrop-filter: blur(12px);
        }
        .tip-text{font-size:12px;margin-top:6px;color:#888;}

        /* 悬浮提示 5秒消失 */
        .float-tip{
            position:fixed;top:70px;left:50%;transform:translateX(-50%);
            background:rgba(34,197,94,0.9);color:#fff;
            padding:10px 24px;border-radius:30px;
            z-index:9999;backdrop-filter:blur(10px);
            display:none;
        }
    </style>
</head>
<body>
<!-- 悬浮提示 -->
<div class="float-tip" id="floatTip">✅ 游客登录成功，正在进入介绍页...</div>

<!-- 灵动岛 音乐 -->
<div class="island">
<audio controls loop preload="auto">
  <source src="https://music.163.com/song/media/outer/url?id=1399112638.mp3" type="audio/mpeg">
</div>

<canvas id="particles"></canvas>
<button class="themeBtn" id="themeBtn">浅色</button>

<!-- 在线数据面板 -->
<div class="data-panel">
    <div class="data-item">
        <p>实时在线</p>
        <span id="onlineNum">0</span>
    </div>
    <div class="data-item">
        <p>今日访问</p>
        <span id="todayVis">0</span>
    </div>
    <div class="data-item">
        <p>总访问量</p>
        <span id="countNum">286</span>
    </div>
</div>

<!-- 全员可见公告 -->
<div class="notice-box">
    <div class="notice-title">
        <span>📢 服务器公告</span>
        <div>
            <button class="notice-btn" onclick="unlockEdit()">解锁编辑</button>
            <button class="notice-btn" onclick="clearNotice()">清空</button>
        </div>
    </div>
    <textarea class="notice-content" id="noticeContent">欢迎进入DN服务器！
服务器稳定运行中，禁止违规内容。</textarea>
    <div class="tip-text" id="editTip">🔒 游客只读，输入管理员密码解锁编辑</div>
</div>

<div class="login-card">
    <h2>DN服务器 卡密验证</h2>
    <input type="text" class="input-box" id="pwd" placeholder="请输入管理员卡密">
    <button class="submit-btn" onclick="checkPwd()">管理员登录</button>
    <button class="guest-btn" onclick="guestLogin()">游客快速登录</button>
</div>

<script>
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', ()=>{
    document.body.classList.toggle('light-mode');
    themeBtn.innerText = document.body.classList.contains('light-mode')?'深色':'浅色';
});

// 双管理员密码
const adminPwdList = ["cyz201105", "dndnttt"];
let isEditOpen = false;

// 管理员登录
function checkPwd(){
    let pwd = document.getElementById("pwd").value.trim();
    if(adminPwdList.includes(pwd)){
        location.href="admin.html";
    }else{
        alert("卡密错误");
    }
}

// 游客登录：弹窗5秒消失 + 跳转介绍页
function guestLogin(){
    let tip = document.getElementById("floatTip");
    tip.style.display = "block";
    // 5秒自动隐藏
    setTimeout(()=>{
        tip.style.display = "none";
    },5000);
    // 短暂延迟跳转
    setTimeout(()=>{
        location.href="intro.html";
    },600);
}

// 解锁公告编辑
function unlockEdit(){
    let key = prompt("请输入管理员密码：");
    if(adminPwdList.includes(key)){
        isEditOpen = true;
        document.getElementById('noticeContent').classList.add("edit-on");
        document.getElementById('editTip').innerText = "✅ 已解锁，可自由修改公告";
    }else{
        alert("密码错误，无法编辑");
    }
}

// 清空公告
function clearNotice(){
    if(!isEditOpen){
        alert("请先解锁编辑权限");
        return;
    }
    document.getElementById('noticeContent').value = '';
}

// 模拟在线人数
function randomOnline(){
    let base = 3;
    let random = Math.floor(Math.random() * 8);
    document.getElementById("onlineNum").innerText = base + random;
}
randomOnline();
setInterval(randomOnline,15000);

// 粒子背景
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
let arr=[];
for(let i=0;i<60;i++){
    arr.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        sx:Math.random()*0.15-0.07,
        sy:Math.random()*0.15-0.07
    })
}
function run(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    arr.forEach(v=>{
        v.x+=v.sx;v.y+=v.sy;
        if(v.x<0||v.x>canvas.width)v.sx*=-1;
        if(v.y<0||v.y>canvas.height)v.sy*=-1;
        ctx.beginPath();
        ctx.arc(v.x,v.y,v.r,0,Math.PI*2);
        ctx.fillStyle=document.body.classList.contains('light-mode')?"rgba(0,173,181,0.3)":"rgba(0,173,181,0.5)";
        ctx.fill();
    });
    requestAnimationFrame(run);
}
run();
</script>
</body>
</html>
